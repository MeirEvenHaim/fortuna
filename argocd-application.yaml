apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortuna-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MeirEvenHaim/fortuna/tree/lev-el-lev-3.0'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fortuna-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
