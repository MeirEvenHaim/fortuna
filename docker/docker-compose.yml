version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fortuna_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fortuna_orders
      MYSQL_USER: fortuna_user
      MYSQL_PASSWORD: fortunapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
