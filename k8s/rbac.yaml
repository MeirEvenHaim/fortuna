apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortuna-service-account
  namespace: fortuna-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: fortuna-app
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: fortuna-app
subjects:
- kind: ServiceAccount
  name: fortuna-service-account
  namespace: fortuna-app
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
