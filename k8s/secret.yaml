# NOTE: Do NOT commit actual secrets to Git.
# These values should be replaced during a pipeline step (e.g., using Jenkins credentials)
# or managed via a secure system like AWS Secrets Manager / HashiCorp Vault.
apiVersion: v1
kind: Secret
metadata:
  name: fortuna-secret
  namespace: fortuna-app
type: Opaque
stringData:
  DB_PASSWORD: "<YOUR_SECURE_DB_PASSWORD>"
  MYSQL_ROOT_PASSWORD: "<YOUR_SECURE_ROOT_PASSWORD>"
